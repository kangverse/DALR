[tool.ruff]
# Project-wide Ruff configuration.
# Docs: https://docs.astral.sh/ruff/

target-version = "py37"
line-length = 120
extend-exclude = [
    "SentEval",
    "clip",                       # vendored from OpenAI CLIP
    "src/xbert.py",               # vendored from HuggingFace transformers
    "src/tokenization_bert.py",   # vendored from HuggingFace transformers
    "data",
    "figure",
    "Model",
    "result",
]

[tool.ruff.lint]
# Start with a conservative rule set so contributors are not blocked
# by aggressive auto-fixes. We can expand this over time.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — covered by `line-length`, do not double-warn
    "E741",  # ambiguous variable names (l, I, O) — common in ML code
    "B008",  # do not perform function call in argument defaults — common in PyTorch
    "E402",  # module level import not at top — research scripts adjust sys.path first
    "E701",  # multiple statements on one line — common in compact ML code
    "F841",  # unused local variable — common when iterating on experiments
    "UP031", # printf-style formatting — kept for log message readability
    "B007",  # unused loop variable — common in nested loops over experiments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
